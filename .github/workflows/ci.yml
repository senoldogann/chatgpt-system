name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test
        run: npm run check
      - name: Validate Codex setup CLI
        run: node scripts/setup-codex.mjs --help
      - name: Validate ChatGPT tunnel setup CLI
        run: node scripts/setup-chatgpt-tunnel.mjs --help

  macos-native:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build macOS native helpers
        run: swift build -c release --package-path native/macos-authority-broker
      - name: Verify Keychain helper CLI contract
        run: |
          helper="native/macos-authority-broker/.build/release/chatgpt-system-keychain-helper"
          test -x "$helper"
          if "$helper" store chatgpt-system-ci chatgpt-system-keychain-helper-ci </dev/null 2>keychain-helper.err; then
            echo "Keychain helper unexpectedly accepted an empty credential" >&2
            exit 1
          fi
          grep -q "Credential stdin must not be empty" keychain-helper.err
      - name: Install and self-verify protected authority broker
        run: sudo node scripts/install-macos-authority-broker.mjs
      - name: Verify protected artifacts exist
        run: |
          test -x "/Library/Application Support/chatgpt-system/bin/chatgpt-system-authority-broker"
          test -f "/Library/Application Support/chatgpt-system/etc/authority-broker.sha256"
          test "$(stat -f '%u' "/Library/Application Support/chatgpt-system/bin/chatgpt-system-authority-broker")" = "0"
          test "$(stat -f '%u' "/Library/Application Support/chatgpt-system/etc/authority-broker.sha256")" = "0"
      - name: Test macOS computer runtime
        run: swift test --package-path native/macos-computer-runtime
      - name: Build and package macOS computer runtime
        run: |
          npm run build:computer:macos
          node scripts/package-macos-computer-runtime.mjs --sign - --output "$RUNNER_TEMP/ChatGPTSystemComputerRuntime.app"
          app="$RUNNER_TEMP/ChatGPTSystemComputerRuntime.app"
          test -x "$app/Contents/MacOS/chatgpt-system-computer-runtime"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.senoldogann.chatgpt-system.computer-runtime"
          codesign -v "$app"
      - name: Verify computer runtime protocol health
        run: |
          helper="$RUNNER_TEMP/ChatGPTSystemComputerRuntime.app/Contents/MacOS/chatgpt-system-computer-runtime"
          response="$(printf '%s\n' '{"protocolVersion":1,"requestId":"ci-health","method":"health","params":{}}' | "$helper")"
          node -e '
            const r = JSON.parse(process.argv[1]);
            if (r.protocolVersion !== 1 || r.requestId !== "ci-health" || r.ok !== true) process.exit(1);
            if (typeof r.result?.accessibilityTrusted !== "boolean") process.exit(1);
            if (typeof r.result?.screenCaptureAuthorized !== "boolean") process.exit(1);
          ' "$response"
