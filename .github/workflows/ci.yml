name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and test
        run: npm run check
      - name: Validate Codex setup CLI
        run: node scripts/setup-codex.mjs --help
      - name: Validate ChatGPT tunnel setup CLI
        run: node scripts/setup-chatgpt-tunnel.mjs --help

  macos-native:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build macOS authority broker
        run: swift build -c release --package-path native/macos-authority-broker
