name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and test
        run: npm run check
      - name: Validate Codex setup CLI
        run: node scripts/setup-codex.mjs --help
      - name: Validate ChatGPT tunnel setup CLI
        run: node scripts/setup-chatgpt-tunnel.mjs --help

  macos-native:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build macOS native helpers
        run: swift build -c release --package-path native/macos-authority-broker
      - name: Verify Keychain helper byte-exact create and update
        run: |
          account="chatgpt-system-ci"
          service="chatgpt-system-keychain-helper-ci-${RANDOM}-$$"
          initial="old-ci_$(uuidgen)"
          value="sk-proj-ci_A-B_C_$(uuidgen)"
          helper="native/macos-authority-broker/.build/release/chatgpt-system-keychain-helper"
          trap 'security delete-generic-password -a "$account" -s "$service" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$initial" | "$helper" store "$account" "$service"
          printf '%s' "$value" | "$helper" store "$account" "$service"
          actual="$(security find-generic-password -a "$account" -s "$service" -w)"
          test "$actual" = "$value"
      - name: Install and self-verify protected authority broker
        run: sudo node scripts/install-macos-authority-broker.mjs
      - name: Verify protected artifacts exist
        run: |
          test -x "/Library/Application Support/chatgpt-system/bin/chatgpt-system-authority-broker"
          test -f "/Library/Application Support/chatgpt-system/etc/authority-broker.sha256"
          test "$(stat -f '%u' "/Library/Application Support/chatgpt-system/bin/chatgpt-system-authority-broker")" = "0"
          test "$(stat -f '%u' "/Library/Application Support/chatgpt-system/etc/authority-broker.sha256")" = "0"
